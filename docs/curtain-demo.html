<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curtain transitions — preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F2EE;
    --ink:#1B1F3B;
    --muted:#5F6482;
    --line:rgba(27,31,59,.18);
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;min-height:100%;
    background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    font-size:17px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
  .serif:lang(ar){font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-weight:500}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* ---------- header ---------- */
  .site-header{
    position:fixed;top:0;inset-inline:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:1.25rem clamp(1.25rem,4vw,2.5rem);
  }
  .brand{font-size:1.45rem;color:inherit;text-decoration:none}
  .nav{display:flex;gap:clamp(1rem,3vw,2rem)}
  .nav a{
    color:inherit;text-decoration:none;padding-block:.2rem;
    border-bottom:1px solid transparent;transition:border-color .2s;
  }
  .nav a:hover{border-color:var(--line)}
  .nav a[aria-current="page"]{border-color:currentColor}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .lang button{
    appearance:none;border:0;background:transparent;color:inherit;font:inherit;
    padding:.25rem .75rem;border-radius:999px;cursor:pointer;line-height:1.3;
  }
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

  /* ---------- page ---------- */
  main{
    min-height:100dvh;max-width:68rem;margin-inline:auto;
    padding:9rem clamp(1.25rem,4vw,2.5rem) 7rem;
    display:grid;align-content:center;
  }
  h1{font-size:clamp(3.5rem,10vw,8.5rem);line-height:.95;letter-spacing:-.015em;margin:0 0 1.75rem}
  h1:lang(ar){font-size:clamp(3rem,9vw,7rem);line-height:1.2;letter-spacing:0}
  h1:focus{outline:none}
  .lede{font-size:1.2rem;max-width:34rem;color:var(--muted);margin:0}
  .lede a{color:var(--ink)}
  .rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .rows li{
    display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
    padding:1.1rem 0;border-bottom:1px solid var(--line);
  }
  .rows .serif{font-size:1.6rem}
  .rows span:last-child{color:var(--muted);font-size:.95rem}

  /* ---------- curtain ---------- */
  .curtain{position:fixed;inset:0;z-index:50;visibility:hidden;pointer-events:none}
  .curtain.is-active{visibility:visible;pointer-events:auto}
  .curtain__panels{position:absolute;inset:0;display:flex;direction:ltr}
  .curtain__panel{
    flex:1 1 0;background:var(--ink);
    box-shadow:0 0 0 1px var(--ink);   /* hides sub-pixel seams between strips */
    will-change:transform;transform:translateY(-101%);
  }
  .curtain__label{
    position:absolute;inset:0;display:grid;place-items:center;padding:2rem;
    color:var(--paper);font-size:clamp(3rem,11vw,10rem);line-height:1;
    opacity:0;text-align:center;
  }

  /* ---------- dev controls (not part of the site) ---------- */
  .controls{
    position:fixed;right:1.25rem;bottom:1.25rem;z-index:20;width:16rem;
    direction:ltr;text-align:left;
    background:var(--ink);color:var(--paper);
    border-radius:.9rem;padding:1rem 1.1rem 1.1rem;
    font-size:.82rem;display:grid;gap:.6rem;
    box-shadow:0 20px 50px rgba(27,31,59,.25);
  }
  .controls h2{margin:0 0 .15rem;font-size:.95rem;font-weight:500}
  .controls label{display:grid;gap:.3rem}
  .controls select{width:100%;font:inherit;color:var(--ink);background:var(--paper);padding:.4rem .45rem;border-radius:.4rem;border:0}
  .controls input[type=range]{width:100%;margin:0}
  .controls button{
    font:inherit;padding:.5rem .7rem;border-radius:.5rem;cursor:pointer;
    border:1px solid rgba(241,242,238,.35);background:transparent;color:inherit;
  }
  .controls button:hover{background:rgba(241,242,238,.1)}
  .controls .hint{opacity:.65;margin:0;line-height:1.4}
  @media (max-width:640px){
    .controls{width:auto;left:1rem;right:1rem}
    .nav{gap:.9rem}
  }
</style>
</head>
<body>

<header class="site-header">
  <a class="brand serif" href="#home" data-page="home" id="brand">Haydar</a>
  <nav class="nav" id="nav" aria-label="Primary"></nav>
  <div class="lang" id="langSwitch">
    <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
    <button type="button" data-lang="ar" aria-pressed="false" lang="ar">عربي</button>
  </div>
</header>

<main id="page"></main>

<!-- Curtain starts covering the page so first paint is the reveal, not a flash of content -->
<div class="curtain is-active" id="curtain" aria-hidden="true">
  <div class="curtain__panels" id="panels"><div class="curtain__panel" style="transform:none"></div></div>
  <div class="curtain__label serif" id="curtainLabel"></div>
</div>

<aside class="controls" aria-label="Transition settings">
  <h2>Curtain preview</h2>
  <label>Page transition
    <select id="pageVariant">
      <option value="slab">Slab — one panel, vertical wipe</option>
      <option value="blinds">Blinds — 5 strips, staggered</option>
      <option value="theatre">Theatre — meets in the middle</option>
    </select>
  </label>
  <label>Language transition
    <select id="langVariant">
      <option value="sweep">Sweep — follows reading direction</option>
      <option value="theatre">Theatre — meets in the middle</option>
      <option value="slab">Slab — vertical wipe</option>
    </select>
  </label>
  <label>Speed <span id="speedVal">1.0×</span>
    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
  </label>
  <button type="button" id="replay">Replay last transition</button>
  <p class="hint">Click the nav or EN / عربي. Reduced-motion users get a crossfade instead of the curtain.</p>
</aside>

<script>
  // ---------- config (mirror these values in the Nuxt build) ----------
  const EASE     = 'cubic-bezier(.76,0,.24,1)';   // symmetric in-out, feels like weight
  const EASE_OUT = 'cubic-bezier(.22,1,.36,1)';
  const BASE = { close: 550, hold: 120, open: 650, stagger: 60 };   // ms at 1×

  // ---------- placeholder content ----------
  const content = {
    en: {
      dir: 'ltr', name: 'Haydar', langName: 'English',
      nav: { home: 'Home', work: 'Work', about: 'About', contact: 'Contact' },
      pages: {
        home:    { title: 'Haydar',  body: `<p class="lede">Placeholder copy. The finished site takes its content from the CV — this file only previews how moving between pages and languages will feel.</p>` },
        work:    { title: 'Work',    body: `<ul class="rows"><li><span class="serif">Project one</span><span>2026</span></li><li><span class="serif">Project two</span><span>2025</span></li><li><span class="serif">Project three</span><span>2025</span></li></ul>` },
        about:   { title: 'About',   body: `<p class="lede">Placeholder copy. Every fact on the finished site traces back to a line in the CV.</p>` },
        contact: { title: 'Contact', body: `<p class="lede">Placeholder. <a href="#">hello@example.com</a></p>` },
      },
    },
    ar: {
      dir: 'rtl', name: 'حيدر', langName: 'العربية',
      nav: { home: 'الرئيسية', work: 'الأعمال', about: 'عني', contact: 'تواصل' },
      pages: {
        home:    { title: 'حيدر',     body: `<p class="lede">نص مؤقت. المحتوى الحقيقي للموقع يأتي من السيرة الذاتية — هذا الملف لمعاينة الانتقال بين الصفحات واللغات فقط.</p>` },
        work:    { title: 'الأعمال',  body: `<ul class="rows"><li><span class="serif">المشروع الأول</span><span>2026</span></li><li><span class="serif">المشروع الثاني</span><span>2025</span></li><li><span class="serif">المشروع الثالث</span><span>2025</span></li></ul>` },
        about:   { title: 'عني',      body: `<p class="lede">نص مؤقت. كل معلومة في الموقع النهائي مصدرها السيرة الذاتية.</p>` },
        contact: { title: 'تواصل',    body: `<p class="lede">نص مؤقت. <a href="#">hello@example.com</a></p>` },
      },
    },
  };

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const page = $('page'), nav = $('nav'), brand = $('brand');
  const curtain = $('curtain'), panels = $('panels'), curtainLabel = $('curtainLabel');
  const pageVariant = $('pageVariant'), langVariant = $('langVariant');
  const speed = $('speed'), speedVal = $('speedVal');
  const langButtons = [...document.querySelectorAll('[data-lang]')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');

  const state = { page: 'home', lang: 'en' };
  let busy = false;
  let last = null;

  // ---------- render ----------
  function render() {
    const c = content[state.lang];
    const p = c.pages[state.page];
    document.documentElement.lang = state.lang;
    document.documentElement.dir = c.dir;
    document.title = `${p.title} — ${c.name}`;
    brand.textContent = c.name;
    nav.innerHTML = Object.entries(c.nav)
      .map(([k, v]) => `<a href="#${k}" data-page="${k}"${k === state.page ? ' aria-current="page"' : ''}>${v}</a>`)
      .join('');
    page.innerHTML = `<h1 class="serif" tabindex="-1">${p.title}</h1>${p.body}`;
    langButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
    history.replaceState(null, '', `#${state.page}`);
  }

  // ---------- animation helpers ----------
  const anim = (el, kf, o) => el.animate(kf, { fill: 'forwards', ...o }).finished;
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const dur  = () => { const s = parseFloat(speed.value); return { close: BASE.close / s, hold: BASE.hold / s, open: BASE.open / s, stagger: BASE.stagger / s }; };
  const buildPanels = (n) => { panels.innerHTML = Array.from({ length: n }, () => '<div class="curtain__panel"></div>').join(''); };

  // Each variant: how many panels, and how each panel closes (covers) and opens (reveals).
  // ctx.dir = reading direction of the *destination*; ctx.order(i) = stagger index from the reading start side.
  const variants = {
    slab: {
      count: 1,
      close: (p, i, d) => anim(p, [{ transform: 'translateY(101%)' }, { transform: 'translateY(0)' }], { duration: d.close, easing: EASE }),
      open:  (p, i, d) => anim(p, [{ transform: 'translateY(0)' }, { transform: 'translateY(-101%)' }], { duration: d.open, easing: EASE }),
    },
    blinds: {
      count: 5,
      close: (p, i, d, ctx) => anim(p, [{ transform: 'translateY(-101%)' }, { transform: 'translateY(0)' }], { duration: d.close, delay: ctx.order(i) * d.stagger, easing: EASE }),
      open:  (p, i, d, ctx) => anim(p, [{ transform: 'translateY(0)' }, { transform: 'translateY(101%)' }], { duration: d.open, delay: ctx.order(i) * d.stagger, easing: EASE }),
    },
    theatre: {
      count: 2,
      close: (p, i, d) => anim(p, [{ transform: `translateX(${i ? '101%' : '-101%'})` }, { transform: 'translateX(0)' }], { duration: d.close, easing: EASE }),
      open:  (p, i, d) => anim(p, [{ transform: 'translateX(0)' }, { transform: `translateX(${i ? '101%' : '-101%'})` }], { duration: d.open, easing: EASE }),
    },
    sweep: {
      count: 1,
      // Enters from the side the new language reads from, exits the other way.
      close: (p, i, d, ctx) => anim(p, [{ transform: `translateX(${ctx.dir === 'rtl' ? '101%' : '-101%'})` }, { transform: 'translateX(0)' }], { duration: d.close, easing: EASE }),
      open:  (p, i, d, ctx) => anim(p, [{ transform: 'translateX(0)' }, { transform: `translateX(${ctx.dir === 'rtl' ? '-101%' : '101%'})` }], { duration: d.open, easing: EASE }),
    },
  };

  // ---------- the transition ----------
  async function transition({ variant, label, dir, swap }) {
    if (busy) return;
    busy = true;
    last = { variant, label, dir };

    if (reduced.matches) {
      await anim(page, [{ opacity: 1 }, { opacity: 0 }], { duration: 180, easing: 'ease' });
      swap(); window.scrollTo(0, 0);
      await anim(page, [{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease' });
      page.querySelector('h1')?.focus({ preventScroll: true });
      busy = false;
      return;
    }

    const v = variants[variant];
    const d = dur();
    const ctx = { dir, order: (i) => (dir === 'rtl' ? v.count - 1 - i : i) };

    buildPanels(v.count);
    const panelEls = [...panels.children];
    curtainLabel.textContent = label;
    curtainLabel.lang = dir === 'rtl' ? 'ar' : 'en';
    curtain.classList.add('is-active');

    // 1. close — label starts fading in partway through so the covered moment isn't empty
    const labelIn = anim(curtainLabel,
      [{ opacity: 0, transform: 'translateY(.15em)' }, { opacity: 1, transform: 'translateY(0)' }],
      { duration: d.open * 0.5, delay: d.close * 0.55, easing: EASE_OUT });
    await Promise.all(panelEls.map((p, i) => v.close(p, i, d, ctx)));

    // 2. swap content while fully covered
    swap();
    window.scrollTo(0, 0);
    await labelIn;
    await wait(d.hold);

    // 3. open
    await Promise.all([
      anim(curtainLabel, [{ opacity: 1 }, { opacity: 0 }], { duration: Math.max(150, d.open * 0.35), easing: 'ease' }),
      ...panelEls.map((p, i) => v.open(p, i, d, ctx)),
    ]);

    curtain.classList.remove('is-active');
    page.querySelector('h1')?.focus({ preventScroll: true });
    busy = false;
  }

  // ---------- actions ----------
  function goTo(p) {
    if (p === state.page || busy) return;
    const c = content[state.lang];
    transition({ variant: pageVariant.value, label: c.nav[p], dir: c.dir, swap: () => { state.page = p; render(); } });
  }
  function setLang(l) {
    if (l === state.lang || busy) return;
    const target = content[l];
    transition({ variant: langVariant.value, label: target.langName, dir: target.dir, swap: () => { state.lang = l; render(); } });
  }

  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-page]');
    if (a) { e.preventDefault(); goTo(a.dataset.page); return; }
    const b = e.target.closest('[data-lang]');
    if (b) setLang(b.dataset.lang);
  });
  $('replay').addEventListener('click', () => { if (last) transition({ ...last, swap: () => {} }); });
  speed.addEventListener('input', () => { speedVal.textContent = (+speed.value).toFixed(1) + '×'; });

  // ---------- first load: reveal instead of flash ----------
  async function reveal() {
    busy = true;
    const hash = location.hash.slice(1);
    if (content.en.pages[hash]) state.page = hash;
    render();

    await Promise.race([document.fonts?.ready ?? Promise.resolve(), wait(1500)]);
    if (reduced.matches) { curtain.classList.remove('is-active'); busy = false; return; }

    curtainLabel.textContent = content[state.lang].name;
    const d = dur();
    await anim(curtainLabel, [{ opacity: 0, transform: 'translateY(.15em)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 500, easing: EASE_OUT });
    await wait(350);
    await Promise.all([
      anim(curtainLabel, [{ opacity: 1 }, { opacity: 0 }], { duration: 250, easing: 'ease' }),
      anim(panels.firstElementChild, [{ transform: 'translateY(0)' }, { transform: 'translateY(-101%)' }], { duration: d.open + 150, easing: EASE }),
    ]);
    curtain.classList.remove('is-active');
    busy = false;
  }
  reveal();
</script>
</body>
</html>
